<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f16">
<title>大宗商品持仓</title>
<link rel="preconnect" href="https://fapi.binance.com" crossorigin>
<link rel="dns-prefetch" href="https://fapi.binance.com">
<link rel="dns-prefetch" href="https://fapi1.binance.com">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f16'/%3E%3Ctext x='16' y='22' font-size='13' text-anchor='middle' fill='%23f0b90b' font-family='Arial' font-weight='bold'%3EXAU%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0f16; --panel:#111827; --panel2:#151d29; --line:#232f42; --line2:#1a2433;
    --txt:#d8dee6; --muted:#8b98ab; --dim:#5b6a7e;
    --gold:#f0b90b; --green:#22c55e; --red:#e05c53; --purple:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .mono{font-variant-numeric:tabular-nums;font-family:Consolas,"Microsoft YaHei UI",monospace}

  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,#101724,#0b1018);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:17px;color:var(--gold);font-weight:700;letter-spacing:.5px;margin-right:auto;white-space:nowrap}
  header h1 .sub{font-size:12px;color:var(--dim);font-weight:400;letter-spacing:0}
  .btn{background:#1c2430;color:#e6edf3;border:1px solid #2b3648;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.primary{background:linear-gradient(180deg,#f0b90b,#d9a406);border-color:var(--gold);color:#0b0f16;font-weight:700}
  .btn.primary:hover{background:linear-gradient(180deg,#fcd34d,#e5b60a);color:#0b0f16}
  .btn.danger{background:#c0392b;border-color:#e05c53;color:#fff;font-weight:700}
  .btn.danger:hover{background:#dc4a3d;color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed;border-color:#2b3648;color:#6c7b8f;background:#151b25}
  .btn.primary:disabled{background:#2a2410;color:#6b6237;border-color:#3a3320}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}

  .autobar{display:flex;align-items:center;gap:12px;padding:7px 16px;background:#0c121b;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .netpill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid #27405f;background:#101f37;color:#9fb4c9;white-space:nowrap}
  .netpill .dot{width:7px;height:7px;border-radius:50%;background:#7d93ab}
  .netpill.ok{border-color:rgba(34,197,94,.45);color:var(--green);background:#0f2318}
  .netpill.ok .dot{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.8)}
  .netpill.bad{border-color:rgba(224,92,83,.5);color:#ff7b72;background:#2a1b1b}
  .netpill.bad .dot{background:var(--red);box-shadow:0 0 6px rgba(224,92,83,.85)}
  .cd{color:var(--muted);white-space:nowrap}
  .cd b{color:var(--green);font-size:17px;font-variant-numeric:tabular-nums;margin:0 2px}
  .autostat{color:#9cc3ff}
  .slot{color:#f0b90b}
  .autobar .btn.gold{background:#f0b90b;color:#0b0f16;border-color:#f0b90b;font-weight:700;padding:5px 14px}
  .autobar .btn.gold:hover{background:#fcd34d;color:#0b0f16}

  #opLog{max-height:96px;overflow:auto;padding:5px 16px;background:#0a0f17;border-bottom:1px solid #16202e;font-size:12px;line-height:1.7;color:var(--muted)}
  #opLog .t{color:var(--dim);margin-right:8px}
  #opLog .ok{color:var(--green)}
  #opLog .err{color:var(--red)}
  #opLog .empty{color:#4c5a6d}

  main{flex:1;min-height:0;display:flex;flex-direction:column}
  #tblWrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--panel)}
  #tblWrap .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;padding:24px;text-align:center;line-height:2}
  table{width:100%;min-width:780px;border-collapse:separate;border-spacing:0;white-space:nowrap;table-layout:fixed}
  thead th{position:sticky;z-index:4;background:#16233a;color:#8fa8c4;font-weight:600;font-size:12px;padding:6px 7px;border-bottom:1px solid #2c3f5c}
  thead tr:first-child th{top:0;height:31px}
  thead tr:last-child th{top:31px}
  thead th.sym{left:0;z-index:6;text-align:left;padding-left:12px;color:#c9ddf5;border-right:1px solid #2c3f5c;width:150px}
  thead th.acct-head{text-align:center;color:#c9ddf5;border-left:1px solid #0b0f16}
  thead th.sub{color:#7f93ad;font-weight:400}
  .tag{display:inline-block;font-size:11px;font-weight:400;border-radius:3px;padding:0 5px;margin-left:6px}
  .tag.ok{background:rgba(34,197,94,.15);color:var(--green)}
  .tag.err{background:rgba(224,92,83,.16);color:#ff7b72}
  .tag.na{background:rgba(125,147,171,.15);color:#7d93ab}
  .mini5{display:inline-block;font-size:10px;color:var(--purple);background:rgba(124,58,237,.18);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:middle}
  tbody td{padding:6px 7px;border-bottom:1px solid var(--line2);text-align:center}
  tbody tr:hover td{background:#17233a}
  tbody tr.alt td{background:var(--panel2)}
  tbody tr.alt:hover td{background:#1a2740}
  tbody tr.gap td{height:8px;padding:0;border:none;background:transparent}
  td.sym{position:sticky;left:0;z-index:3;text-align:left;font-weight:600;color:#eaf2ff;padding-left:12px;background:#131c2a;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}
  tbody tr.alt td.sym{background:#192333}
  tbody tr:hover td.sym{background:#1b2a45}
  td.pos{text-align:left;padding-left:10px}
  td.pos .dir{display:inline-block;margin-right:5px;font-weight:600}
  td.pos.long .dir{color:var(--green)}
  td.pos.short .dir{color:var(--red)}
  td.pos.dash .dir{color:#4d5b6e}
  td.pos .val,td.roi{font-variant-numeric:tabular-nums}
  td.roi.plus{color:var(--green)}
  td.roi.minus{color:var(--red)}
  td.roi.dash,td.pos.dash .val{color:var(--dim)}
  td.op{white-space:nowrap;padding-right:9px}
  .sno{display:inline-block;font-size:10px;color:#5f7190;margin-right:4px;font-variant-numeric:tabular-nums}
  .op-btn{min-width:46px}
  .errTag{font-size:11px;color:var(--red);font-weight:600}
  footer{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:6px 16px;background:#0a1322;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  footer .summary{color:#c9ddf5}
  #status{color:#4dc3ff}

  .mask{position:fixed;inset:0;background:rgba(3,6,12,.72);display:none;align-items:center;justify-content:center;z-index:50}
  #dlgMask{z-index:70}
  .mask.show{display:flex}
  .modal{background:#0f1a30;border:1px solid #27405f;border-radius:10px;width:min(680px,94vw);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .modal h3{padding:13px 18px;border-bottom:1px solid #20334d;font-size:15px;color:#eaf2ff}
  .modal .body{padding:14px 18px;font-size:13px;line-height:1.8;color:var(--txt)}
  #dlgBody{white-space:pre-wrap}
  .modal .foot{padding:11px 18px;border-top:1px solid #20334d;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  .tip{white-space:normal;font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px}
  .hint{font-size:12px;color:var(--dim)}
  .arow{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
  .arow input[type=text],.arow input[type=password]{flex:1;min-width:120px;background:#0b0f16;border:1px solid #2b3648;border-radius:6px;color:#e6edf3;padding:7px 9px;font-size:13px;outline:none}
  .arow input:focus{border-color:var(--gold)}
  .arow .nm{flex:0 0 108px;min-width:96px}
  .arow .del{border:none;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 7px;line-height:1;border-radius:4px}
  .arow .del:hover{color:var(--red)}
  .arow .lbl5x{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;white-space:nowrap}
  .tools{display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}

  #toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;pointer-events:none}
  .toast{background:#111c2e;border:1px solid #2b4a6e;color:#dbe7f5;border-radius:8px;padding:9px 16px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .18s ease-out;max-width:90vw}
  .toast.ok{border-color:rgba(34,197,94,.5);color:#b8f5cc}
  .toast.err{border-color:rgba(224,92,83,.55);color:#ffc2bd}
  .toast.warn{border-color:#a97a1c;color:#f5d68a}
  .toast.out{opacity:0;transition:opacity .25s}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (max-width:720px){
    header h1{font-size:15px;width:100%;margin-right:0}
    header h1 .sub{display:none}
    header{gap:8px;padding:9px 12px}
    header .btn{padding:6px 11px;font-size:12px}
    .autobar{padding:6px 12px;gap:9px}
    footer{padding:5px 12px;gap:10px}
    #opLog{padding:4px 12px}
  }
</style>
</head>
<body>

<header>
  <h1>大宗商品持仓 <span class="sub">多单 / 空单 · 多账户 · 纯浏览器直连</span></h1>
  <button class="btn" id="viewBtn">显示全部</button>
  <button class="btn primary" id="btnRefresh">刷新</button>
  <button class="btn" id="btnSet">设置 API 密钥</button>
</header>

<div class="autobar">
  <button class="btn primary" id="autoBtn">开始</button>
  <span class="netpill" id="netPill"><i class="dot"></i><span id="netText">网络检测中…</span></span>
  <span class="cd">下一轮 <b id="cdNum">--</b> 秒</span>
  <span class="autostat" id="autoStat">未开始：点「开始」后每 9 秒刷新一次，按序号补空位开仓，只开仓不加仓</span>
  <span class="slot" id="slotInfo"></span>
</div>
<div id="opLog"></div>

<main>
  <div id="tblWrap"><div class="empty">尚未添加账户。点击右上角「设置 API 密钥」填入 API Key 后查看持仓。</div></div>
</main>

<footer>
  <span class="summary" id="summary"></span>
  <span id="status">就绪</span>
</footer>

<!-- 通用弹窗 -->
<div class="mask" id="dlgMask">
  <div class="modal">
    <h3 id="dlgTitle">提示</h3>
    <div class="body" id="dlgBody"></div>
    <div class="foot">
      <button class="btn" id="dlgCancel">取消</button>
      <button class="btn primary" id="dlgOk">确认</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="mask" id="setMask">
  <div class="modal">
    <h3>设置 · 账户密钥</h3>
    <div class="body">
      <p class="tip">每个账户一行：账户名 + API Key + Secret。只需只读持仓权限，密钥仅保存在本浏览器 localStorage，页面直连币安，无服务器中转。</p>
      <div id="setRows"></div>
      <div class="tools">
        <button class="btn sm" id="btnAddRow">＋ 添加账户</button>
        <span class="hint" id="setHint"></span>
      </div>
    </div>
    <div class="foot">
      <button class="btn" id="btnTest">测试连接</button>
      <button class="btn primary" id="btnSave">保存设置</button>
      <button class="btn" id="btnCloseSet">关闭</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
"use strict";

/* ===================== 常量 ===================== */
const PAIRS = [
  ["CLUSDT","原油"],["BZUSDT","布伦特"],["XAGUSDT","白银"],["NATGASUSDT","天然气"],
  ["COPPERUSDT","铜"],["XPTUSDT","铂金"],["XPDUSDT","钯金"],["USDBRLUSDT","雷亚尔"],
  ["SOXLUSDT","半导体3倍"],["ANTUSDT","Anthropic"],["SPCXUSDT","SpaceX"],
  ["SNDKUSDT","闪迪"],["NVDAUSDT","英伟达"],["MUUSDT","美光"]
];
const PAIR_NAMES = {};
PAIRS.forEach(([s,n]) => { PAIR_NAMES[s] = n; });

const API_LIST = ["https://fapi.binance.com","https://fapi1.binance.com"];
let API = API_LIST[0];
const GET_TIMEOUT = 6000;
const POST_TIMEOUT = 15000;
const ACCOUNT_KEY = "cm_accounts_v1";
const CACHE_KEY = "cm_cache_v3";
const LOG_KEY = "op_log_v1";
const RULE_KEY = "cm_rules_v1";
const RULE_TTL = 7*24*3600*1000;
const LEV5_SCALE = 100/7.5;     // 5 倍杠杆账户：实际 7.5% = 正常 100%
const ROI_BLOCK = -100;         // ROI ≤ -100% 才允许加仓
const DIRS = ["多单","空单"];
const AUTO_INTERVAL = 9;        // 自动刷新间隔（秒）
const MAX_TRY_PER_CYCLE = 5;    // 一轮最多尝试 5 个空位
const MAX_ACCOUNTS = 20;

/* ===================== 状态 ===================== */
const state = {
  accs: [],
  results: [],
  byId: {},
  view: "filter",
  fetching: false,
  dur: 0,
  cacheAt: 0
};
const auto = {
  running:false, busy:false, nextAt:0, latency:0,
  failed:new Set(), timer:null, rulesWarned:false
};
const dualCache = {};           // 账户 id → 是否双向持仓
let dlgOnOk = null;
let flight = null;              // 单飞：手动/自动刷新共用同一次请求

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ===================== 工具 ===================== */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function fmtMoney(v){ const n=parseFloat(v); return isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"—"; }
function fmtUsd(v){ const n=parseFloat(v); return isFinite(n)?("$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})):"—"; }
function hhmmss(d){ return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2); }
function setText(el,t){ if(el && el.__t!==t){ el.textContent=t; el.__t=t; } }
function setCls(el,c){ if(el && el.__c!==c){ el.className=c; el.__c=c; } }
function setMsg(el,t){ if(el && el.__m!==t){ el.textContent=t; el.__m=t; } }
function trimNum(v){ return String(Number(v)).replace(/(\.\d*?[1-9])0+$/, "$1").replace(/\.0+$/, ""); }
function toast(msg,type){
  const box=$("toasts");
  const d=document.createElement("div");
  d.className="toast "+(type||"");
  d.textContent=msg;
  box.appendChild(d);
  setTimeout(()=>{ d.classList.add("out"); setTimeout(()=>d.remove(),260); }, type==="err"?6000:3600);
}
function setStatus(t){ setMsg($("status"), t); }

/* ===================== 账户存取 ===================== */
let accCache = null;
function loadAcc(){
  if(accCache) return accCache;
  try{ accCache = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "[]") || []; }
  catch(e){ accCache = []; }
  return accCache;
}
function saveAcc(list){
  accCache = list;
  state.accs = list;
  try{ localStorage.setItem(ACCOUNT_KEY, JSON.stringify(list)); }catch(e){}
}
function accRes(id){ return state.byId[id]; }
function setResults(res){
  state.results = res;
  const byId = {};
  res.forEach(r => { byId[r.acc.id] = r; });
  state.byId = byId;
}

/* ===================== SHA-256 / HMAC ===================== */
function _bytesToHex(b){ return Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join(""); }
function _sha256(data){
  const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  const total=(((data.length+9+63)>>>6)*64)>>>0, by=new Uint8Array(total);
  by.set(data); by[data.length]=0x80;
  const bitLen=data.length*8, dv=new DataView(by.buffer);
  dv.setUint32(by.length-4,bitLen>>>0); dv.setUint32(by.length-8,Math.floor(bitLen/0x100000000));
  const w=new Uint32Array(total/4);
  for(let i=0;i<w.length;i++) w[i]=dv.getUint32(i*4);
  const W=new Uint32Array(64);
  for(let block=0;block<w.length;block+=16){
    for(let t=0;t<16;t++) W[t]=w[block+t];
    for(let t=16;t<64;t++){
      const s0=R(W[t-15],7)^R(W[t-15],18)^(W[t-15]>>>3), s1=R(W[t-2],17)^R(W[t-2],19)^(W[t-2]>>>10);
      W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=R(e,6)^R(e,11)^R(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+W[t])>>>0;
      const S0=R(a,2)^R(a,13)^R(a,22), maj=(a&b)^(a&c)^(b&c), t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const out=new Uint8Array(32), ov=new DataView(out.buffer);
  for(let i=0;i<8;i++) ov.setUint32(i*4,H[i]);
  return out;
}
function _hmac(key,data){
  const BLOCK=64; let k=new Uint8Array(BLOCK);
  if(key.length>BLOCK) key=_sha256(key);
  k.set(key);
  const ipad=new Uint8Array(BLOCK), opad=new Uint8Array(BLOCK);
  for(let i=0;i<BLOCK;i++){ ipad[i]=k[i]^0x36; opad[i]=k[i]^0x5c; }
  const inner=new Uint8Array(BLOCK+data.length); inner.set(ipad); inner.set(data,BLOCK);
  const outer=new Uint8Array(BLOCK+BLOCK); outer.set(opad); outer.set(_sha256(inner),BLOCK);
  return _sha256(outer);
}
async function signQuery(query,secret){
  const msg=new TextEncoder().encode(query), key=new TextEncoder().encode(secret);
  if(window.crypto && crypto.subtle){
    try{
      const ko=await crypto.subtle.importKey("raw",key,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
      const sig=await crypto.subtle.sign("HMAC",ko,msg);
      return _bytesToHex(new Uint8Array(sig));
    }catch(e){}
  }
  return _bytesToHex(_hmac(key,msg));
}

/* ===================== 网络层 ===================== */
let offMs=0, timeOk=false, lastSync=0, syncToken=null;
let netAt=0, netOk=null, latency=0;

function setNet(ok,ms){
  const pill=$("netPill"), tx=$("netText");
  if(!pill) return;
  pill.classList.toggle("ok", ok===true);
  pill.classList.toggle("bad", ok===false);
  tx.textContent = ok===null ? "网络检测中…" : ok ? ("网络正常"+(ms>0?(" "+ms+"ms"):"")) : "网络异常";
}
async function httpJson(url,opts,timeoutMs){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const r=await fetch(url, Object.assign({cache:"no-store"}, opts||{}, {signal:ctrl.signal}));
    let body=null;
    try{ body=await r.json(); }catch(e){ body=null; }
    if(body===null) throw new Error("响应异常（HTTP "+r.status+"）");
    return body;
  }catch(e){
    const m=String((e&&e.name)||"")+" "+String((e&&e.message)||"");
    if(/abort/i.test(m)) throw new Error("请求超时（网络不稳定）");
    if(/failed to fetch|networkerror|fetch failed|load failed/i.test(m)) throw new Error("网络连接失败");
    throw e;
  }finally{ clearTimeout(timer); }
}
function altHost(){ return API===API_LIST[0] ? API_LIST[1] : API_LIST[0]; }
async function apiGet(path,timeoutMs){
  const t=timeoutMs||GET_TIMEOUT;
  try{ return await httpJson(API+path, {method:"GET"}, t); }
  catch(e){
    const h=altHost();
    const j=await httpJson(h+path, {method:"GET"}, t);
    API=h;
    return j;
  }
}
async function syncOnce(){
  if(syncToken) return syncToken;
  syncToken=(async()=>{
    try{
      const j=await apiGet("/fapi/v1/time?t="+Date.now(), 4000);
      const ms=Number(j.serverTime);
      if(!(ms>0)) throw new Error("bad time");
      offMs=ms-Date.now(); timeOk=true; lastSync=Date.now();
      return true;
    }catch(e){ timeOk=false; return false; }
    finally{ syncToken=null; }
  })();
  return syncToken;
}
async function syncTime(force){
  if(!force && timeOk && Date.now()-lastSync<60000) return true;
  return await syncOnce();
}
function nowMs(){ return Date.now()+offMs; }
async function pingNet(force){
  const now=Date.now();
  if(!force && netOk!==null && now-netAt<3000) return netOk;
  netAt=now;
  const t0=performance.now();
  try{
    await apiGet("/fapi/v1/ping", 4000);
    latency=Math.round(performance.now()-t0);
    netOk=true; setNet(true,latency);
    return true;
  }catch(e){
    latency=0; netOk=false; setNet(false);
    return false;
  }
}

/* ===================== 签名请求 ===================== */
async function signedFetch(acc,path,method,params){
  const m=(method||"GET").toUpperCase();
  const once=async()=>{
    const all=Object.assign({timestamp:nowMs(), recvWindow:10000}, params||{});
    const qs=Object.keys(all).sort().map(k=>k+"="+encodeURIComponent(all[k])).join("&");
    const sig=await signQuery(qs, acc.secret);
    const url=path+"?"+qs+"&signature="+sig;
    const opts={method:m, headers:{"X-MBX-APIKEY":acc.key}};
    if(m==="POST") opts.headers["Content-Type"]="application/x-www-form-urlencoded";
    if(m==="POST") return await httpJson(API+url, opts, POST_TIMEOUT);   // 下单不跨域名重试，避免重复成交
    try{ return await httpJson(API+url, opts, GET_TIMEOUT); }
    catch(e){
      const h=altHost();
      const j=await httpJson(h+url, opts, GET_TIMEOUT);
      API=h;
      return j;
    }
  };
  let j=await once();
  if(j && (j.code===-1021 || j.code===-1022)){    // 时间戳偏差：校正一次后重发
    await syncTime(true);
    j=await once();
  }
  if(j && typeof j==="object" && !Array.isArray(j) && j.code!==undefined && String(j.code)!=="200"){
    throw new Error("code "+j.code+"："+(j.msg||"接口返回错误"));
  }
  return j;
}

/* ===================== 交易规则（exchangeInfo 缓存） ===================== */
let RULES=null, rulesWarm=false, rulesPromise=null, rulesLastFetch=0, RULES_T=0;
function loadRulesCache(){
  if(RULES) return;
  try{
    const d=JSON.parse(localStorage.getItem(RULE_KEY)||"null");
    // 网络异常时允许用 4 周内的旧规则兜底，成功拉到新规则后会覆盖
    if(d && d.m && Date.now()-d.t<RULE_TTL*4){ RULES=d.m; RULES_T=d.t; }
  }catch(e){}
  if(!RULES) RULES={};
}
function rulesReady(){ loadRulesCache(); return Object.keys(RULES).length>0; }
function ruleFromInfo(info, sym){
  const s=(info.symbols||[]).find(x=>x.symbol===sym);
  if(!s) return null;
  const f={};
  (s.filters||[]).forEach(x=>{ f[x.filterType]=x; });
  const lot=f.MARKET_LOT_SIZE||f.LOT_SIZE||{};
  let step=parseFloat(lot.stepSize)||0;
  if(step<=0) step=Math.pow(10,-(parseInt(s.quantityPrecision,10)||3));
  return {
    step,
    precision: parseInt(s.quantityPrecision,10)||3,
    minQty: parseFloat(lot.minQty)||0,
    minNotional: parseFloat((f.MIN_NOTIONAL||{}).notional)||0
  };
}
function fetchRules(){
  if(rulesPromise) return rulesPromise;
  // 已有规则且 10 分钟内拉过：不再反复请求
  if(Object.keys(RULES).length && Date.now()-rulesLastFetch<600000) return Promise.resolve(true);
  rulesPromise=(async()=>{
    try{
      const info=await apiGet("/fapi/v1/exchangeInfo", 12000);
      if(!info || !info.symbols) return false;
      PAIRS.forEach(([s])=>{ const r=ruleFromInfo(info,s); if(r) RULES[s]=r; });
      rulesLastFetch=Date.now(); RULES_T=rulesLastFetch;
      try{ localStorage.setItem(RULE_KEY, JSON.stringify({t:rulesLastFetch, m:RULES})); }catch(e){}
      return Object.keys(RULES).length>0;
    }catch(e){ return false; }
    finally{ rulesPromise=null; }
  })();
  return rulesPromise;
}
async function warmRules(){
  if(rulesWarm) return;
  if(rulesReady() && Date.now()-RULES_T<86400000) return;   // 一天内不再重复拉
  rulesWarm=true;
  if(!(await fetchRules())) rulesWarm=false;
}
async function getRule(sym){
  if(!RULES) loadRulesCache();
  if(RULES[sym] && Date.now()-RULES_T<86400000) return RULES[sym];
  await fetchRules();
  return RULES[sym] || null;
}
function stepDecimals(step){
  const s=String(step), i=s.indexOf(".");
  return i<0?0:s.length-i-1;
}
function ceilStep(v, step){
  if(!step || step<=0) return v;
  const d=stepDecimals(step);
  return parseFloat((Math.ceil(v/step-1e-9)*step).toFixed(d));
}
function qtyFixed(v,dec){
  const n=parseFloat(v);
  if(!isFinite(n)) return String(v);
  const d=Math.min(Math.max(dec==null?8:dec,0),8);
  let s=n.toFixed(d);
  if(s.indexOf(".")>=0) s=s.replace(/0+$/,"").replace(/\.$/,"");
  return s;
}

/* ===================== 持仓计算 ===================== */
function posNotional(p){
  const n=Math.abs(parseFloat(p.notional));
  if(n>0) return n;
  return Math.abs(parseFloat(p.positionAmt))*parseFloat(p.markPrice||p.entryPrice||0);
}
function calcRoi(p,acc){
  const qty=Math.abs(parseFloat(p.positionAmt));
  const entry=parseFloat(p.entryPrice), upnl=parseFloat(p.unRealizedProfit), lev=parseFloat(p.leverage)||1;
  let margin=parseFloat(p.positionInitialMargin || p.initialMargin || p.isolatedMargin);
  if(!(margin>0)) margin=qty*entry/lev;
  let roi = margin>0 ? (upnl/margin*100) : NaN;
  if(acc && acc.is5x && !isNaN(roi)) roi *= LEV5_SCALE;
  return roi;
}
function roiAddable(p,acc){ const roi=calcRoi(p,acc); return isFinite(roi) && roi<=ROI_BLOCK; }
function roiOver(p,acc){ return !roiAddable(p,acc); }
function findPos(accId,sym,dir){
  const r=accRes(accId);
  if(!r || r.err) return null;
  const m=r.map[sym];
  const p=m ? (dir==="多单"?m.long:m.short) : null;
  return p || null;
}
function pairStats(sym){
  const st={posCnt:0,overCnt:0,sumLong:0,sumShort:0};
  state.accs.forEach(a=>{
    const pL=findPos(a.id,sym,"多单"), pS=findPos(a.id,sym,"空单");
    if(pL){ st.posCnt++; st.sumLong+=Math.abs(parseFloat(pL.positionAmt)||0); if(roiOver(pL,a)) st.overCnt++; }
    if(pS){ st.posCnt++; st.sumShort+=Math.abs(parseFloat(pS.positionAmt)||0); if(roiOver(pS,a)) st.overCnt++; }
  });
  return st;
}
function slotKey(accId,sym,dir){ return accId+"|"+sym+"|"+dir; }

/* ===================== 刷新（单飞） ===================== */
function syncRefreshBtn(){
  const b=$("btnRefresh");
  if(!b) return;
  b.disabled=state.fetching;
  setText(b, state.fetching?"刷新中…":"刷新");
}
async function doRefresh(opts){
  const silent=!!(opts && opts.silent);
  const accs=state.accs;
  if(!accs.length) return false;
  const t0=performance.now();
  state.fetching=true; syncRefreshBtn();
  await pingNet();
  try{
    const results=await Promise.all(accs.map(async acc=>{
      try{
        const rows=await signedFetch(acc, "/fapi/v2/positionRisk");
        if(!Array.isArray(rows)) throw new Error("接口异常："+((rows&&rows.msg)||"非数组返回"));
        const map={};
        rows.forEach(p=>{
          const amt=parseFloat(p.positionAmt);
          if(!amt) return;
          const side=amt>0?"long":"short";
          (map[p.symbol]=map[p.symbol]||{})[side]=p;
        });
        return {acc, map, err:null};
      }catch(e){
        const msg=(e&&e.message)||String(e);
        return {acc, map:{}, err:/401|-2014/.test(msg)?"API Key 无效或权限不足（-2014）":msg};
      }
    }));
    setResults(results);
    state.dur=(performance.now()-t0)/1000;
    render();
    saveCache();
    return true;
  }catch(e){
    if(!silent) toast("刷新失败："+((e&&e.message)||e), "err");
    return false;
  }finally{
    state.fetching=false; syncRefreshBtn();
  }
}
function refresh(opts){
  if(flight) return flight;
  const p=doRefresh(opts);
  flight=p;
  p.finally(()=>{ if(flight===p) flight=null; });
  return p;
}
/* 操作后要看到的一定是最新数据：先等上一次拉取结束，再完整重拉 */
async function refreshNow(){
  const t0=Date.now();
  while(flight && Date.now()-t0<8000) await sleep(200);
  return await refresh();
}

function paintCache(){
  let d=null;
  [CACHE_KEY, "cm_cache_v2"].some(k=>{

      if(v && Array.isArray(v.r) && v.r.length){ d=v; return true; }

}
function accSignature(){

function mkCells(row, accs, sym){

function updateRow(cells, sym, dir){
  cells.forEach((c,ai)=>{
    const acc=state.accs[ai];
    const no=ai*2+(dir==="多单"?1:2);
    setText(c.sno,"#"+no);
    c.btn.dataset.dir=dir;

    const res=accRes(acc.id);
    if(!res || res.err){
      setCls(c.pos,"pos dash");
      setText(c.dirSpan, dir==="多单"?"多":"空"); setText(c.valSpan,"—");
      setCls(c.roi,"roi dash"); setText(c.roi,"—");
      c.btn.style.display="none";
      c.errTag.style.display="";
      setText(c.errTag, res ? "数据失败" : "待刷新");
      const msg=res&&res.err?res.err:"数据未加载";
      if(c.errTag.title!==msg) c.errTag.title=msg;
      return;
    }
    c.errTag.style.display="none";
    const p=findPos(acc.id,sym,dir);
    if(!p){
      setCls(c.pos,"pos dash");
      setText(c.dirSpan, dir==="多单"?"多":"空"); setText(c.valSpan,"—");
      setCls(c.roi,"roi dash"); setText(c.roi,"—");
      c.btn.style.display="";
      setText(c.btn,"开仓"); c.btn.disabled=false;
      c.btn.title="按系统最小开仓额市价开"+dir;
      return;
    }
    const notional=posNotional(p);
    const roi=calcRoi(p,acc);
    setCls(c.pos,"pos "+(dir==="多单"?"long":"short"));
    setText(c.dirSpan, dir==="多单"?"多":"空");
    setText(c.valSpan, fmtUsd(notional));
    setCls(c.roi, "roi "+(isFinite(roi)?(roi>=0?"plus":"minus"):"dash"));
    setText(c.roi, isFinite(roi)?(roi.toFixed(2)+"%"):"—");
    c.btn.style.display="";
    setText(c.btn,"加仓");
    const blocked=!roiAddable(p,acc);
    c.btn.disabled=blocked;
    c.btn.title=blocked
      ? ("ROI "+(isFinite(roi)?roi.toFixed(2)+"%":"未知")+" 未跌破 -100%，禁止加仓")
      : "等量加仓（数量与当前持仓相同）";
  });

/* ===================== 下单 ===================== */
async function getDual(acc){
  if(dualCache[acc.id]!==undefined) return dualCache[acc.id];
  let dual=false;
  try{
    const j=await signedFetch(acc,"/fapi/v1/positionSide/dual");
    const v=j && j.dualSidePosition;
    dual = (v===true || v==="true");
  }catch(e){}
  dualCache[acc.id]=dual;
  return dual;
}
async function wouldFlip(acc,sym,dir){
  const opp=findPos(acc.id, sym, dir==="多单"?"空单":"多单");
  if(!opp) return false;
  return !(await getDual(acc));
}
async function openPlan(sym){
  const [rule, tk]=await Promise.all([
    getRule(sym),
    apiGet("/fapi/v1/premiumIndex?symbol="+sym+"&t="+Date.now(), 5000)
  ]);
  if(!rule || !rule.minNotional) throw new Error("未获取到系统最小开仓额");
  const price=parseFloat(tk && (tk.markPrice || tk.price));
  if(!(price>0)) throw new Error("获取价格失败");
  let qty=ceilStep(rule.minNotional*1.002/price, rule.step);
  if(rule.minQty>0 && qty<rule.minQty) qty=rule.minQty;
  if(qty*price<rule.minNotional) qty=ceilStep(rule.minNotional*1.005/price, rule.step);
  return {qty, price, minNotional:rule.minNotional, dec:stepDecimals(rule.step)};
}
async function sendMarket(acc,sym,dir,qty,dec){
  const dual=await getDual(acc);
  const wanted=dir==="多单"?"LONG":"SHORT";
  const cands=dual?[wanted,"BOTH"]:["BOTH",wanted];    // 兼容双向/单向持仓模式
  const side=dir==="多单"?"BUY":"SELL";
  const quantity=qtyFixed(qty,dec==null?8:dec);
  let lastErr=null;
  for(const ps of cands){
    try{
      return await signedFetch(acc,"/fapi/v1/order","POST",{
        symbol:sym, side, type:"MARKET", quantity, positionSide:ps, newOrderRespType:"ACK"
      });
    }catch(e){
      if(/4061|position side|持仓方向/i.test((e&&e.message)||"")){ lastErr=e; continue; }
      throw e;
    }
  }
  throw lastErr || new Error("下单失败");
}
async function livePos(acc,sym,dir){
  const rows=await signedFetch(acc,"/fapi/v2/positionRisk","GET",{symbol:sym});
  if(!Array.isArray(rows)) throw new Error("持仓查询失败，已取消下单");
  const sign=dir==="多单"?1:-1;
  return rows.find(x=>x.symbol===sym && Math.sign(parseFloat(x.positionAmt)||0)===sign) || null;
}
async function onOpen(btn){
  const accId=Number(btn.dataset.acc);
  const sym=btn.dataset.sym;
  const dir=btn.dataset.dir||"多单";
  const acc=state.accs.find(a=>a.id===accId);
  if(!acc) return;
  if(!accRes(acc.id)){ toast("该账户持仓数据尚未加载，请先刷新","warn"); return; }
  if(state.fetching){ toast("正在刷新持仓，请稍候再操作","warn"); return; }

  const p=findPos(acc.id,sym,dir);
  let plan;
  const oldText=btn.textContent;
  btn.disabled=true; btn.textContent="计算中…";
  try{
    if(p){
      const roi=calcRoi(p,acc);
      if(!roiAddable(p,acc)) throw new Error("当前 ROI "+(isFinite(roi)?roi.toFixed(2)+"%":"未知")+"，未跌破 -100%，不能加仓");
      plan={action:"加仓", qty:Math.abs(parseFloat(p.positionAmt)), dec:8, usd:posNotional(p), roi};
    }else{
      if(await wouldFlip(acc,sym,dir)) throw new Error("该账户为单向持仓模式且已有反向仓位，市价反手会先平仓，已取消");
      const pl=await openPlan(sym);
      plan={action:"开仓", qty:pl.qty, dec:pl.dec, price:pl.price, usd:pl.qty*pl.price, minNotional:pl.minNotional};
    }
  }catch(e){
    toast(e.message,"err");
    btn.disabled=false; btn.textContent=oldText;
    render();
    return;
  }
  btn.disabled=false; btn.textContent=oldText;

  const name=PAIR_NAMES[sym]||"";
  const lines=[
    "账户："+acc.name,
    "交易对："+sym+(name?(" "+name):""),
    "操作："+(plan.action==="加仓"?"等量加仓":"开仓")+dir,
    "数量："+qtyFixed(plan.qty,plan.dec)+"（约 "+fmtUsd(plan.usd)+"）",
    plan.action==="开仓" && plan.minNotional>0 ? ("下单基准：系统最小开仓额 "+plan.minNotional.toFixed(2)+" USDT") : "下单基准：当前仓位数量（等量）",
    "类型：市价单（按当前市价立即成交）",
    "",
    "请确认账户余额充足。市价单可能产生滑点，成交后自动刷新持仓。"
  ];
  openDialog({
    title:"确认下单",
    body:lines.join("\n"),
    okText:"确认下单",
    danger:true,
    onOk:()=>{ closeDialog(); placeOrder(acc,sym,dir,plan); }
  });
  render();
}
async function placeOrder(acc,sym,dir,plan){
  const who=acc.name+" "+sym+(plan.action==="加仓"?" 等量加仓":" 开仓")+dir;
  setStatus(who+" 提交中…");
  try{
    let qty=plan.qty, dec=plan.dec;
    if(plan.action==="加仓"){
      // 下单前实时复核：ROI 必须已跌破 -100%，数量取当前持仓
      const p=await livePos(acc,sym,dir);
      if(!p) throw new Error("未查到该持仓，已取消加仓");
      const roi=calcRoi(p,acc);
      if(!roiAddable(p,acc)) throw new Error("ROI "+(isFinite(roi)?roi.toFixed(2)+"%":"未知")+"，未跌破 -100%，不能加仓");
      qty=Math.abs(parseFloat(p.positionAmt));
      dec=stepDecimals(0.00000001);
      if(!(qty>0)) throw new Error("当前仓位数量为 0，已取消加仓");
    }
    const j=await sendMarket(acc,sym,dir,qty,dec);
    if(!j || !j.orderId) throw new Error((j&&j.msg)||"下单未返回订单号");
    addLog("ok", who+" 数量 "+qtyFixed(qty,dec)+"（订单 "+j.orderId+"）");
    toast("下单成功："+who,"ok");
    setStatus(who+" 已成交，正在刷新…");
    await refreshNow();
    setStatus(who+" 已完成");
  }catch(e){
    const msg=(e&&e.message)||String(e);
    addLog("err", who+" 失败："+msg);
    toast("下单失败："+msg,"err");
    setStatus("下单失败："+msg);
    render();
  }
}

/* ===================== 自动开仓 ===================== */
function currentKeep(){ return PAIRS.map(([s])=>s).filter(sym=>pairNeedsOpen(sym)); }
function pairNeedsOpen(sym){
  const st=pairStats(sym);
  return st.posCnt===0 || st.overCnt===0;
}
function firstEmptySlot(keep){
  for(const sym of keep){
    for(let ai=0; ai<state.accs.length; ai++){
      const a=state.accs[ai];
      const r=accRes(a.id);
      if(!r || r.err) continue;                 // 账户数据不可用：本轮不碰
      for(const dir of DIRS){
        const key=slotKey(a.id,sym,dir);
        if(auto.failed.has(key)) continue;
        if(findPos(a.id,sym,dir)) continue;
        return {acc:a, sym, dir, no:ai*2+(dir==="多单"?1:2)};
      }
    }
  }
  return null;
}
function setAutoStat(t){ setMsg($("autoStat"), t); }
function renderCd(left){
  const el=$("cdNum");
  if(!el) return;
  if(!auto.running){ el.textContent="--"; return; }
  el.textContent = String(left);
}
function showNextSlot(slot){
  if(!slot){ $("slotInfo").textContent=""; return; }
  $("slotInfo").textContent="下一格：No."+slot.no+" "+slot.acc.name+" "+slot.sym+" "+slot.dir;
}
async function autoOpen(slot){
  const acc=slot.acc;
  if(!acc || !acc.key) return false;
  if(await wouldFlip(acc,slot.sym,slot.dir)){
    addLog("err", acc.name+" "+slot.sym+" 自动开仓"+slot.dir+" 跳过：单向持仓且已有反向仓位");
    return false;
  }
  const plan=await openPlan(slot.sym);
  let j;
  try{
    j=await sendMarket(acc,slot.sym,slot.dir,plan.qty,plan.dec);
  }catch(e){
    // 下单请求超时/断网：成交与否未知，本轮必须收手，避免重复开仓
    addLog("err", acc.name+" "+slot.sym+" 自动开仓"+slot.dir+" 请求异常："+((e&&e.message)||e));
    return "placed";
  }
  if(!j || !j.orderId) throw new Error((j&&j.msg)||"下单未返回订单号");
  addLog("ok", acc.name+" "+slot.sym+" 自动开仓"+slot.dir+" "+qtyFixed(plan.qty,plan.dec)+"（约 "+fmtMoney(plan.qty*plan.price)+" USDT，订单 "+j.orderId+"）");
  // 开完立刻重拉，确保后续判断用最新仓位
  await refreshNow();
  if(!findPos(acc.id,slot.sym,slot.dir)){
    addLog("err", acc.name+" "+slot.sym+" "+slot.dir+" 下单成功但暂未显示持仓，请手动确认");
    return "placed";
  }
  return true;
}
async function openOnePerCycle(){
  let tried=0;
  while(tried<MAX_TRY_PER_CYCLE && auto.running){
    const keep=currentKeep();
    const slot=firstEmptySlot(keep);
    showNextSlot(slot);
    if(!slot){
      setAutoStat(keep.length
        ? ("等待中：条件符合但暂无空位（"+keep.join("、")+"），每 "+AUTO_INTERVAL+" 秒巡检")
        : ("等待中：暂无可开仓条件，每 "+AUTO_INTERVAL+" 秒巡检"));
      return;
    }
    tried++;
    setAutoStat("运行中："+slot.acc.name+" "+slot.sym+" "+slot.dir+"（No."+slot.no+"）开仓中…");
    try{
      const r=await autoOpen(slot);
      if(r===true){                              // 成功开一个就收手
        setAutoStat("本轮已开 1 个（No."+slot.no+"），下一轮继续巡检");
        return;
      }
      if(r==="placed"){                          // 已下单但未复核到：本轮不再开别的
        setAutoStat("本轮已下单，等下一轮刷新复核");
        return;
      }
      auto.failed.add(slotKey(slot.acc.id,slot.sym,slot.dir));
    }catch(e){
      auto.failed.add(slotKey(slot.acc.id,slot.sym,slot.dir));
      const msg=(e&&e.message)||String(e);
      addLog("err", slot.acc.name+" "+slot.sym+" 自动开仓异常："+msg);
      await sleep(600);                          // 稍等，避免连续打接口
    }
  }
  if(tried>=MAX_TRY_PER_CYCLE) setAutoStat("本轮连续失败 "+tried+" 次，下一轮再试");
}
async function autoCycle(){
  if(!auto.running || auto.busy) return;
  auto.busy=true;
  auto.nextAt=Date.now()+AUTO_INTERVAL*1000;
  try{
    setAutoStat("正在刷新持仓…");
    await pingNet();
    const ok=await refresh({silent:true});
    if(!auto.running) return;
    if(!ok){ setAutoStat("获取仓位失败，本轮跳过"); return; }
    const hasOk=state.accs.some(a=>{ const r=accRes(a.id); return r && !r.err; });
    if(!hasOk){ setAutoStat("各账户仓位均获取失败，本轮跳过"); return; }
    await warmRules();
    if(!rulesReady()){
      if(!auto.rulesWarned){
        auto.rulesWarned=true;
        addLog("err","交易规则未加载，暂时无法自动开仓（网络恢复后会自动重试）");
      }
      setAutoStat("交易规则未加载，本轮跳过");
      return;
    }
    auto.rulesWarned=false;
    await openOnePerCycle();
  }catch(e){
    const msg=(e&&e.message)||String(e);
    addLog("err","自动开仓运行异常："+msg);
    setAutoStat("运行异常："+msg);
  }finally{
    auto.busy=false;
    // 本轮耗时超过周期时补 1 秒缓冲，避免请求慢时连续空转
    if(auto.nextAt<=Date.now()) auto.nextAt=Date.now()+1000;
    if(auto.running) renderCd(Math.max(0, Math.ceil((auto.nextAt-Date.now())/1000)));
  }
}
function autoTick(){
  if(!auto.running) return;
  const left=Math.max(0, Math.ceil((auto.nextAt-Date.now())/1000));
  renderCd(left);
  if(auto.busy) return;                        // 正在跑本轮：只更新读秒，不叠加
  if(left<=0) autoCycle();
}
function startAuto(){
  if(auto.running) return;
  if(auto.busy){ toast("上一轮正在收尾，请稍后再点「开始」","warn"); return; }
  auto.running=true;
  auto.busy=false;
  auto.failed=new Set();
  auto.rulesWarned=false;
  auto.nextAt=Date.now();
  const b=$("autoBtn");
  b.textContent="停止"; b.className="btn danger";
  setNet(null);
  setAutoStat("运行中：每 "+AUTO_INTERVAL+" 秒刷新一次，只在表格里符合条件的交易对补空位，只开仓不加仓");
  clearInterval(auto.timer);
  auto.timer=setInterval(autoTick,1000);
  autoTick();
}
function stopAuto(){
  auto.running=false;
  clearInterval(auto.timer); auto.timer=null;
  renderCd(0); showNextSlot(null);
  const b=$("autoBtn");
  b.textContent="开始"; b.className="btn primary";
  setAutoStat("已停止，点击「开始」继续");
}
function askStartAuto(){
  if(!state.accs.length){ toast("请先在「设置 API 密钥」里添加账户","warn"); openSet(); return; }
  const keep=currentKeep();
  const slot=state.accs.length?firstEmptySlot(keep):null;
  const lines=[
    "点「开始」后：",
    "· 每 "+AUTO_INTERVAL+" 秒自动刷新一次持仓，显示读秒与网络延迟",
    "· 只在「符合开仓条件」的交易对里补空位（同交易对所有账户、多空整体判定），别的交易对不碰",
    "· 编号：账户1 多=1/空=2，账户2=3/4……按编号顺序扫；一次只开一个",
    "· 报错/被跳过自动换下一条试（一轮最多 "+MAX_TRY_PER_CYCLE+" 个）",
    "· 按系统最小开仓额+缓冲市价开仓，只开仓、不加仓；开完立即复核持仓",
    "· 单向持仓遇反向仓位自动跳过，避免市价反手先平仓",
    "",
    "当前符合条件："+(keep.length?keep.join("、"):"无"),
    slot
      ? ("下一个待开：No."+slot.no+" "+slot.acc.name+" "+slot.sym+" "+slot.dir)
      : (state.accs.length?"当前没有可开仓的空位（或账户数据不可用）":"尚未获取仓位，开始后先拉一次再判断"),
    "",
    "真实资金市价开仓，确认开始？"
  ];
  openDialog({
    title:"开始自动开仓确认",
    body:lines.join("\n"),
    okText:"开始",
    danger:true,
    onOk:()=>{ closeDialog(); startAuto(); }
  });
}

/* ===================== 设置 ===================== */
function rowHtml(a){
  return '<div class="arow" data-id="'+(a.id||"")+'">'+
    '<input class="nm" type="text" value="'+esc(a.name||"")+'" placeholder="账户名">'+
    '<input class="ak" type="text" value="'+esc(a.key||"")+'" placeholder="API Key" autocomplete="off" spellcheck="false">'+
    '<input class="as" type="password" value="'+esc(a.secret||"")+'" placeholder="API Secret" autocomplete="new-password" spellcheck="false">'+
    '<label class="lbl5x" title="5 倍杠杆账户：勾选后 ROI 按 7.5% = 100% 等比缩放"><input class="ax" type="checkbox" '+(a.is5x?"checked":"")+' style="cursor:pointer"> 5x</label>'+
    '<button class="del" title="删除该账户">×</button></div>';
}
function buildSettings(){
  const list=state.accs.length?state.accs:[{id:"",name:"账户1",key:"",secret:"",is5x:false}];
  $("setRows").innerHTML=list.map(rowHtml).join("");
  const rows=$("setRows").querySelectorAll(".arow");
  rows.forEach(r=>{
    r.querySelector(".del").onclick=()=>{
      if($("setRows").querySelectorAll(".arow").length<=1) return;
      r.remove(); renumberSettings();
    };
  });
  renumberSettings();
  updateSetHint();
}
function renumberSettings(){
  const rows=$("setRows").querySelectorAll(".arow");
  rows.forEach((r,i)=>{
    const nm=r.querySelector(".nm");
    if(!nm.value.trim() || /^账户\d+$/.test(nm.value.trim())) nm.value="账户"+(i+1);
    r.querySelector(".del").disabled = rows.length<=1;
  });
  rows.forEach(r=>{ r.querySelector(".del").style.opacity = rows.length<=1 ? .3 : 1; });
}
function updateSetHint(){
  const rows=$("setRows").querySelectorAll(".arow");
  let filled=0;
  rows.forEach(r=>{
    if(r.querySelector(".ak").value.trim() && r.querySelector(".as").value.trim()) filled++;
  });
  $("setHint").textContent="当前 "+rows.length+" 个账户（已填 "+filled+" 个，最多 "+MAX_ACCOUNTS+" 个）。密钥只保存在当前浏览器。";
}
function openSet(){
  buildSettings();
  $("setMask").classList.add("show");
}
function closeSet(){ $("setMask").classList.remove("show"); }
function addRow(){
  const rows=$("setRows").querySelectorAll(".arow").length;
  if(rows>=MAX_ACCOUNTS){ toast("最多支持 "+MAX_ACCOUNTS+" 个账户","warn"); return; }
  $("setRows").insertAdjacentHTML("beforeend", rowHtml({id:"",name:"账户"+(rows+1),key:"",secret:"",is5x:false}));
  const r=$("setRows").lastElementChild;
  r.querySelector(".del").onclick=()=>{
    if($("setRows").querySelectorAll(".arow").length<=1) return;
    r.remove(); renumberSettings();
  };
  renumberSettings();
  updateSetHint();
  r.querySelector(".ak").focus();
}
function collectSettings(){
  const out=[]; let missing=false;
  $("setRows").querySelectorAll(".arow").forEach((r,i)=>{
    const key=r.querySelector(".ak").value.trim();
    const secret=r.querySelector(".as").value.trim();
    if(!key && !secret) return;
    if(!key || !secret){ missing=true; return; }
    const nm=r.querySelector(".nm").value.trim() || ("账户"+(out.length+1));
    const oldId=r.dataset.id ? Number(r.dataset.id) : null;
    out.push({id:oldId || (Date.now()+out.length), name:nm, key, secret, is5x:r.querySelector(".ax").checked});
  });
  return {accs:out, missing};
}
function saveSet(){
  const {accs, missing}=collectSettings();
  if(missing){ toast("有账户只填了 Key 或只填了 Secret，请补全后再保存","err"); return; }
  if(!accs.length){ toast("请至少填写一个账户的 Key + Secret","warn"); return; }
  saveAcc(accs);
  Object.keys(dualCache).forEach(k=>delete dualCache[k]);
  closeSet();
  toast("已保存 "+accs.length+" 个账户","ok");
  setStatus("正在刷新持仓…");
  refresh();
}

}

$("btnTest").onclick=testConn;
$("setMask").onclick=e=>{ if(e.target===$("setMask")) closeSet(); };
$("setRows").addEventListener("input", updateSetHint);

function init(){
  state.accs=loadAcc();
  updateViewBtn();
  renderLog();
  render();
  if(state.accs.length){
    if(!paintCache()) setStatus("正在获取持仓…");
    refresh().then(ok=>{
      if(!ok) return;
      const errs=state.results.filter(r=>r.err).length;
      setStatus("已刷新 "+hhmmss(new Date())+" · 耗时 "+state.dur.toFixed(1)+"s"+(errs?(" · "+errs+" 个账户失败"):""));
    });
  }else{
    setStatus("尚未添加账户");
  }
  pingNet();
  // 打开页面即后台预取交易规则，点开仓时不再等大文件下载
  setTimeout(warmRules, 800);
  if("serviceWorker" in navigator){
    addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
}
init();
</script>
</body>
</html>
